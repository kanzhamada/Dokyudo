name: Deploy STB Worker

on:
  push:
    branches: [ "main" ]
    # Workflow ini HANYA jalan kalau ada perubahan di folder stb-worker
    paths:
      - 'apps/stb-worker/**'
      - '.github/workflows/deploy-stb-worker.yml'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (Untuk Cross-Compile ARM64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ubah nama owner repo ke huruf kecil (syarat Docker image name)
      - name: Downcase Image Name
        run: |
          echo "IMAGE_NAME=${github_repository_owner,,}/dokyudo-stb-worker" >> ${GITHUB_ENV}
        env:
          github_repository_owner: ${{ github.repository_owner }}

      - name: Build and push ARM64 Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/stb-worker
          # Targetkan khusus ke OS Armbian Aarch64 milik STB
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Memanfaatkan cache Github Actions agar build selanjutnya lebih cepat
          cache-from: type=gha
          cache-to: type=gha,mode=max
