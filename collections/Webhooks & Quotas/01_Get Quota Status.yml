info:
  name: Get Quota Status
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/quota"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Queries current month quota usage (uploads, searches, Q&A, storage in MB) against the tenant tier limits (Free vs Pro).
