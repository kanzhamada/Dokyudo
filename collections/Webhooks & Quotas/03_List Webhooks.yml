info:
  name: List Webhooks
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/webhooks"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Returns a list of all registered webhooks for the active tenant context.
