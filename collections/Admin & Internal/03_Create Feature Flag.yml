info:
  name: Create Feature Flag
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/admin/feature-flags"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Authorization
      value: "Bearer {{accessToken}}"
  body:
    type: json
    data: |-
      {
        "name": "rag_enabled",
        "description": "Enable streaming RAG Q&A",
        "isEnabled": true
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Admin route to define a new system feature flag.
