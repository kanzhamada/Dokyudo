info:
  name: Update Feature Flag
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/feature-flags/{{flagId}}"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Authorization
      value: "Bearer {{accessToken}}"
  body:
    type: json
    data: |-
      {
        "isEnabled": false
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Admin route to modify status/description on an existing feature flag.
