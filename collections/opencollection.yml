opencollection: 1.0.0

info:
  name: Dokyudo API Collection
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  headers:
    - name: Content-Type
      value: application/json
  variables:
    - name: baseUrl
      value: http://localhost:8000
    - name: accessToken
      value: ""
    - name: refreshToken
      value: ""
    - name: documentId
      value: "123e4567-e89b-12d3-a456-426614174000"
    - name: conversationId
      value: "321e4567-e89b-12d3-a456-426614174000"
    - name: webhookId
      value: "542e4567-e89b-12d3-a456-426614174000"
    - name: flagId
      value: "642e4567-e89b-12d3-a456-426614174000"
    - name: flagName
      value: "rag_enabled"
    - name: tenantId
      value: "tenant_abc123"

docs:
  content: |
    # Dokyudo API Collection
    This collection contains organized folders and requests to fully test Dokyudo's API endpoints.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
