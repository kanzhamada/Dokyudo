docs: Logs in a tenant via Supabase Auth after reCAPTCHA v3 validation, lockout check, and anti-bruteforce rate limiting. Returns short-lived access JWT and refresh token. Failed attempts are logged to public.login_attempts. After 5 failures (same email+IP in 15 min), account locks for 15 minutes. Tokens are auto-captured as runtime variables.
