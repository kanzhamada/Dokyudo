  url: "{{baseUrl}}/api/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "kaitoukid818@gmail.com",
        "password": "kaitoukid81@gmail.com",
        "recaptchaToken": "{{recaptchaToken}}"
      }

runtime:
  variables:
