info:
  name: OAuth GitHub Callback
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/auth/oauth/github/callback"
  params:
    - name: code
      value: "{{githubAuthCode}}"
      type: query
    - name: state
      value: "{{oauthState}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0

docs: |
  GitHub OAuth callback handler. Called by GitHub after user grants consent.
  Flow:
    1. Validates state param against Redis key oauth:{state} (single-use, 5-min TTL).
    2. Exchanges authorization code for GitHub access token.
    3. Fetches user profile from GET /user; if email is null/private, falls back to GET /user/emails
       to retrieve the first verified email (email_verified=true filter applied per PRD §5.1).
    4. Upserts user+tenant record (or links provider if email already exists).
    5. Issues Dokyudo JWT (15-min) + Redis session (24-h), then redirects to /app/dashboard.
  Returns: HTTP 302 to /app/dashboard on success, HTTP 401 if state is invalid/expired or no verified email found.
  Internal classification: PUBLIC (no auth token required — this IS the auth initiation).
