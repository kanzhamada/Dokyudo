info:
  name: Refresh Token
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/auth/refresh"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: accessToken
        method: jsonq
      variable:
        name: accessToken
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Uses the stored refresh token to silently issue a new short-lived access JWT without requiring re-authentication.
