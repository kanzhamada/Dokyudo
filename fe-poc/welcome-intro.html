<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dokyudo — Kinetic Welcome Intro</title>
  
  <!-- Fallback Google Fonts Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    /* ==========================================================
       Gambetta Typography Declarations
       ========================================================== */
    @font-face {
      font-family: 'Gambetta';
      src: url('../apps/frontend/static/fonts/gambetta/Gambetta-Variable.woff2') format('woff2'),
           url('/fonts/gambetta/Gambetta-Variable.woff2') format('woff2');
      font-weight: 300 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Gambetta';
      src: url('../apps/frontend/static/fonts/gambetta/Gambetta-VariableItalic.woff2') format('woff2'),
           url('/fonts/gambetta/Gambetta-VariableItalic.woff2') format('woff2');
      font-weight: 300 700;
      font-style: italic;
      font-display: swap;
    }

    /* ==========================================================
       Dokyudo Design Tokens (Monochrome Base + Terracotta Accents)
       ========================================================== */
    :root {
      --color-black: oklch(14% 0 0);
      --color-offblack: oklch(22% 0 0);
      --color-graphite: oklch(32% 0 0);
      --color-gray: oklch(50% 0 0);
      --color-warm-gray: oklch(68% 0 0);
      --color-gray-light: oklch(82% 0 0);
      --color-offwhite: oklch(95% 0 0);
      --color-white: oklch(100% 0 0);
      --color-terracotta: oklch(67.4% 0.15 52);
      --border-dark: oklch(100% 0 0 / 0.12);

      --font-gambetta: 'Gambetta', 'Gambetta-Variable', 'Newsreader', Georgia, 'Times New Roman', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-black);
      /* Subtle low-opacity white polkadot backdrop (from sec-cap) */
      background-image: radial-gradient(
        circle,
        rgba(250, 250, 250, 0.089) 1px,
        transparent 1px
      );
      background-size: 24px 24px;
      color: var(--color-offwhite);
      font-family: var(--font-gambetta);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Preview Control Bar */
    .preview-bar {
      position: fixed;
      top: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--color-offblack);
      border: 1px solid var(--border-dark);
      padding: 6px 16px;
      border-radius: 9999px;
      z-index: 60;
      font-family: var(--font-gambetta);
      font-size: 13px;
    }

    .preview-bar label {
      color: var(--color-warm-gray);
    }

    .preview-input {
      background: var(--color-black);
      border: 1px solid var(--border-dark);
      color: var(--color-white);
      padding: 4px 10px;
      border-radius: 6px;
      font-family: var(--font-gambetta);
      font-size: 13px;
      outline: none;
      width: 120px;
    }

    .preview-input:focus {
      border-color: var(--color-terracotta);
    }

    .btn-replay {
      background: var(--color-white);
      border: none;
      color: var(--color-black);
      padding: 4px 14px;
      border-radius: 9999px;
      font-family: var(--font-gambetta);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .btn-replay:hover {
      opacity: 0.88;
      transform: scale(0.97);
    }

    /* Main Center Animation Stage */
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Dokyudo Logo Background Layer (Monochrome scale-down) */
    .logo-backdrop {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(5);
      width: 340px;
      height: 380px;
      pointer-events: none;
      opacity: 0;
      z-index: 1;
    }

    .logo-backdrop svg {
      width: 100%;
      height: 100%;
    }

    .logo-backdrop svg path {
      fill: var(--color-white);
    }

    /* Frame Text Container */
    .frame-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }

    .frame-text {
      font-family: var(--font-gambetta);
      font-size: clamp(48px, 8vw, 100px);
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: -0.03em;
      color: var(--color-white);
      opacity: 0;
      transform: scale(0.92) translateY(20px);
      will-change: transform, opacity;
    }

    .terracotta {
      color: var(--color-terracotta);
    }

    .frame-text.dokyudo-title {
      font-family: var(--font-gambetta);
      font-weight: 500;
      font-size: clamp(52px, 8.5vw, 104px);
      letter-spacing: -0.03em;
      color: var(--color-white);
    }

    .frame-text.dokyudo-title span.in-prefix {
      font-family: var(--font-gambetta);
      font-style: italic;
      font-weight: 400;
      font-size: 0.85em;
      color: var(--color-warm-gray);
      margin-right: 18px;
    }

    /* Bottom Minimal Pip Progress */
    .timeline-indicator {
      position: fixed;
      bottom: 28px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 50;
    }

    .pip {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-graphite);
      transition: all 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pip.active {
      width: 22px;
      border-radius: 9999px;
      background: var(--color-terracotta);
    }
  </style>
</head>
<body>

  <!-- Preview Controller -->
  <div class="preview-bar">
    <label for="nameInput">Name:</label>
    <input type="text" id="nameInput" class="preview-input" value="Kanz" />
    <button class="btn-replay" id="replayBtn">
      &#8634; Replay
    </button>
  </div>

  <main class="stage">

    <!-- Dokyudo Favicon Logo (Monochrome scale-down) -->
    <div class="logo-backdrop" id="logoBackdrop">
      <svg width="476" height="537" viewBox="0 0 476 537" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M257.254 0.587891C294.051 8.946 348.053 31.5262 393.29 72.7383C439.082 114.456 476.221 175.71 476.222 259.703C476.222 362.011 435.241 431.474 386.472 475.079C338.928 517.589 283.365 535.972 252.013 535.972V488.646C269.762 488.646 314.473 475.969 354.927 439.799C394.155 404.724 428.896 347.884 428.896 259.703C428.895 191.305 399.187 142.131 361.418 107.723C324.14 73.7611 279.341 54.6272 249.267 47.3262H47.3262V486.634C80.0122 482.766 120.755 473.604 156.914 456.683C203.119 435.061 237.172 403.228 243.995 357.931L244.03 357.697L244.069 357.465C246.687 342.165 249.111 327.943 251.344 314.721H99.9775V267.395H259.165C266.58 221.004 270.263 191.414 269.912 172.288C269.712 161.386 268.154 157.399 267.642 156.361C266.771 156.014 264.101 155.22 257.634 154.978C220.532 153.586 145.849 154.397 112.825 154.99L112.4 131.331L111.975 107.671C144.813 107.081 220.787 106.236 259.407 107.685C272.381 108.171 289.294 110.409 301.796 123.476C313.981 136.211 316.91 153.956 317.23 171.42C317.626 192.951 313.921 223.888 307.097 267.395H347.258V314.721H299.352C296.722 330.342 293.843 347.185 290.737 365.335C280.399 432.939 229.746 474.853 176.974 499.548C123.916 524.376 64.0017 534.276 24.6689 535.95L0 537V0H254.667L257.254 0.587891Z" />
      </svg>
    </div>

    <!-- Frame 1: Welcome <User>! -->
    <div class="frame-container">
      <h1 class="frame-text" id="frame1">
        Welcome <span class="terracotta" id="userNameSpan">Kanz</span>!
      </h1>
    </div>

    <!-- Frame 2: Let's Search -->
    <div class="frame-container">
      <h1 class="frame-text" id="frame2">
        Let's Search
      </h1>
    </div>

    <!-- Frame 3: Your -->
    <div class="frame-container">
      <h1 class="frame-text" id="frame3">
        <span class="terracotta">Your</span>
      </h1>
    </div>

    <!-- Frame 4: Documents -->
    <div class="frame-container">
      <h1 class="frame-text" id="frame4">
        Documents
      </h1>
    </div>

    <!-- Frame 5: With Meaning -->
    <div class="frame-container">
      <h1 class="frame-text" id="frame5">
        With <span class="terracotta">Meaning</span>
      </h1>
    </div>

    <!-- Frame 6: in Dokyudo -->
    <div class="frame-container">
      <h1 class="frame-text dokyudo-title" id="frame6">
        <span class="in-prefix">in</span><span class="terracotta">Dokyudo</span>
      </h1>
    </div>

  </main>

  <!-- Bottom Pip Progress -->
  <div class="timeline-indicator">
    <div class="pip" id="pip0"></div>
    <div class="pip" id="pip1"></div>
    <div class="pip" id="pip2"></div>
    <div class="pip" id="pip3"></div>
    <div class="pip" id="pip4"></div>
    <div class="pip" id="pip5"></div>
  </div>

  <script>
    let currentTl = null;

    function setPip(index) {
      document.querySelectorAll('.pip').forEach((pip, idx) => {
        pip.classList.toggle('active', idx === index);
      });
    }

    function runIntroSequence() {
      const userName = document.getElementById('nameInput').value.trim() || 'User';
      document.getElementById('userNameSpan').textContent = userName;

      if (currentTl) {
        currentTl.kill();
      }

      const f1 = document.getElementById('frame1');
      const f2 = document.getElementById('frame2');
      const f3 = document.getElementById('frame3');
      const f4 = document.getElementById('frame4');
      const f5 = document.getElementById('frame5');
      const f6 = document.getElementById('frame6');
      const logo = document.getElementById('logoBackdrop');

      // Reset all initial properties
      gsap.set([f1, f2, f3, f4, f5, f6], {
        opacity: 0,
        scale: 0.92,
        y: 18
      });

      gsap.set(logo, {
        opacity: 0,
        scale: 4.8
      });

      const tl = gsap.timeline();
      currentTl = tl;

      // ── FRAME 1: "Welcome <Name>!" ──
      tl.call(() => setPip(0))
        .to(f1, {
          opacity: 1,
          scale: 1,
          y: 0,
          duration: 0.4,
          ease: "power3.out"
        })
        .to(f1, {
          opacity: 0,
          scale: 1.05,
          y: -16,
          duration: 0.28,
          ease: "power2.in"
        }, "+=0.75")

      // ── FRAME 2: "Let's Search" ──
      tl.call(() => setPip(1))
        .to(f2, {
          opacity: 1,
          scale: 1,
          y: 0,
          duration: 0.35,
          ease: "power3.out"
        })
        .to(f2, {
          opacity: 0,
          scale: 1.05,
          y: -16,
          duration: 0.25,
          ease: "power2.in"
        }, "+=0.45")

      // ── FRAME 3: "Your" (Terracotta) ──
      tl.call(() => setPip(2))
        .to(f3, {
          opacity: 1,
          scale: 1,
          y: 0,
          duration: 0.3,
          ease: "power3.out"
        })
        .to(f3, {
          opacity: 0,
          scale: 1.06,
          y: -14,
          duration: 0.22,
          ease: "power2.in"
        }, "+=0.32")

      // ── FRAME 4: "Documents" ──
      tl.call(() => setPip(3))
        .to(f4, {
          opacity: 1,
          scale: 1,
          y: 0,
          duration: 0.35,
          ease: "power3.out"
        })
        .to(f4, {
          opacity: 0,
          scale: 1.05,
          y: -16,
          duration: 0.25,
          ease: "power2.in"
        }, "+=0.4")

      // ── FRAME 5: "With Meaning" (Meaning = Terracotta) ──
      tl.call(() => setPip(4))
        .to(f5, {
          opacity: 1,
          scale: 1,
          y: 0,
          duration: 0.38,
          ease: "power3.out"
        })
        .to(f5, {
          opacity: 0,
          scale: 1.05,
          y: -16,
          duration: 0.28,
          ease: "power2.in"
        }, "+=0.45")

      // ── FRAME 6: Logo Shrink & "in Dokyudo" ──
      tl.call(() => setPip(5))
        // Logo zooms in from huge scale (4.8x) down to backdrop scale (1.0x)
        .to(logo, {
          opacity: 0.09,
          scale: 1.0,
          duration: 0.75,
          ease: "expo.out"
        })
        // "in Dokyudo" emerges simultaneously in Gambetta (Dokyudo = Terracotta)
        .to(f6, {
          opacity: 1,
          scale: 1,
          y: 0,
          duration: 0.55,
          ease: "power4.out"
        }, "-=0.68");
    }

    // Auto-run on load
    window.addEventListener('DOMContentLoaded', runIntroSequence);

    // Replay triggers
    document.getElementById('replayBtn').addEventListener('click', runIntroSequence);
    document.getElementById('nameInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') runIntroSequence();
    });
  </script>
</body>
</html>
