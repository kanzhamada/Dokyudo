docs: |
  ## Route Classification — IMPORTANT

  This folder contains two distinct categories of endpoints. Do NOT conflate them during security testing or implementation.

  ### /internal/* — Service-to-Service (No Token)
  - Called exclusively by the API Gateway to evaluate feature flags before forwarding tenant requests.
  - These routes are TRUSTED internal calls and do NOT require an Authorization header.
  - Must be network-isolated in production (e.g., private Docker network or Deno Deploy internal networking).
  - Example: GET /internal/features/:flagName?tenant_id=...

  ### /api/admin/* — Admin Frontend (Admin JWT Required)
  - Called from the SvelteKit Admin UI (/admin/* routes).
  - Requires a valid JWT with role=admin claim in the Authorization header.
  - These are standard authenticated HTTP endpoints, not service-to-service.
  - Examples: GET /api/admin/feature-flags, GET /api/admin/tenants, GET /api/admin/webhook-logs
