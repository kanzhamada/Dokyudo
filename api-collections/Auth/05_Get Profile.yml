info:
  name: Get Profile
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/me"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Returns the authenticated user details along with the associated tenant context.
