info:
  name: Get Presigned Upload URL
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/documents/presigned"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  params:
    - name: filename
      value: "architecture.pdf"
      type: query
    - name: mimeType
      value: "application/pdf"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Generates a presigned PUT URL directly to the Supabase Storage S3 object storage, bypassing backend bandwidth for large uploads (max 25MB).
