info:
  name: List Documents
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/documents"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Lists all documents uploaded by the authenticated tenant with their current ingestion status (pending, processing, ready, failed).
