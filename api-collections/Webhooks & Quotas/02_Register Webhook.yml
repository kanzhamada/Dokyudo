info:
  name: Register Webhook
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/webhooks"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Authorization
      value: "Bearer {{accessToken}}"
  body:
    type: json
    data: |-
      {
        "url": "https://client-app.com/webhooks"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Registers or updates a webhook destination URL to receive asynchronous status updates via signed POST payloads.
